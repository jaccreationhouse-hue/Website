  <!-- Google tag (gtag.js) delayed until the page is idle for performance -->
  <script>
    window.addEventListener('load', function() {
      var analyticsScheduled = false;
      var loadAnalytics = function() {
        if (document.getElementById('ga-script-external')) return;
        var script = document.createElement('script');
        script.id = 'ga-script-external';
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-9ZPVXPPH73';
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-9ZPVXPPH73');
      };
      var scheduleAnalytics = function() {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadAnalytics, { timeout: 8000 });
        } else {
          setTimeout(loadAnalytics, 8000);
        }
      };
      var startAnalytics = function() {
        if (analyticsScheduled) return;
        analyticsScheduled = true;
        window.removeEventListener('pointerdown', startAnalytics);
        window.removeEventListener('keydown', startAnalytics);
        window.removeEventListener('scroll', startAnalytics);
        scheduleAnalytics();
      };
      window.addEventListener('pointerdown', startAnalytics, { once: true, passive: true });
      window.addEventListener('keydown', startAnalytics, { once: true });
      window.addEventListener('scroll', startAnalytics, { once: true, passive: true });
      setTimeout(startAnalytics, 30000);
    });
  </script>

  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      var runWhenIdle = function(callback) {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(callback, { timeout: 5000 });
        } else {
          setTimeout(callback, 2500);
        }
      };

      window.addEventListener('load', () => {
        runWhenIdle(() => {
          if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const registration of registrations) {
                registration.unregister();
              }
            });
            caches.keys().then((keys) => {
              for (const key of keys) {
                caches.delete(key);
              }
            });
          } else {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then((registration) => {
                console.log('[SW] Registered, scope:', registration.scope);
                registration.onupdatefound = () => {
                  const installingWorker = registration.installing;
                  if (installingWorker) {
                    installingWorker.onstatechange = () => {
                      if (installingWorker.state === 'installed') {
                        if (navigator.serviceWorker.controller) {
                          caches.keys().then((keys) => {
                            Promise.all(keys.map(key => caches.delete(key))).then(() => {
                              window.location.reload();
                            });
                          });
                        }
                      }
                    };
                  }
                };
              })
              .catch((err) => {
                console.warn('[SW] Registration failed:', err);
              });
          }
        });
      });
    }
  </script>
